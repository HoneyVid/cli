name: Release

# Publishes to npm when package.json has a new version, and to the official MCP Registry when server.json changes.
# - npm trusted publishing (OIDC): no npm token exists; npm accepts only this workflow in the `npm` environment.
# - The publish job installs nothing: the CLI has zero runtime dependencies (`npm publish --ignore-scripts`).
# - mcp-publisher is pinned to a release at least a week old and checked against GitHub's sha256 before it runs;
#   its domain key (MCP_REGISTRY_KEY) lives only in the `registry` environment.
# - SHA-pinned actions, read-only default permissions, GitHub-hosted runners, no pull_request triggers.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Publish if this version is new
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "honeyvid@${version}" version >/dev/null 2>&1; then
            echo "honeyvid@${version} is already on npm; nothing to publish."; exit 0
          fi
          scripts/fetch-skills.sh
          npm publish --access public --ignore-scripts
          echo "Published honeyvid@${version}."

  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish server.json if it changed
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- server.json; then
            echo "server.json unchanged; nothing to publish."; exit 0
          fi
          version=v1.8.7
          sha=00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/${version}/mcp-publisher_linux_amd64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login http --domain honeyvid.ai --private-key "$MCP_REGISTRY_KEY"
          "$RUNNER_TEMP/mcp-publisher" publish
